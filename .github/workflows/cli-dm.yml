name: sing-box CLI - Desktop + OpenWRT (Doctor Mobile)

# Builds the sing-box CLI (./cmd/sing-box) for the desktop (Windows) and router
# (OpenWRT/Linux) targets, so a future Windows CLI / OpenWRT edition has its core
# ready. Routers run the CLI directly (the GUI apps use the libcore from
# hiddify-core). Pure-Go (CGO off). Publishes a Release on a cli-* tag.
on:
  push:
    tags: ['cli-*']
  workflow_dispatch:

env:
  SB_TAGS: with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_grpc,tfogo_checklinkname0,with_conntrack

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-amd64,          goos: windows, goarch: amd64, ext: '.exe' }
          - { name: windows-arm64,          goos: windows, goarch: arm64, ext: '.exe' }
          - { name: linux-amd64,            goos: linux,   goarch: amd64 }
          - { name: linux-arm64,            goos: linux,   goarch: arm64 }
          - { name: linux-armv7,            goos: linux,   goarch: arm,    goarm: '7' }
          - { name: linux-mipsle-softfloat, goos: linux,   goarch: mipsle, gomips: softfloat }
          - { name: linux-mips-softfloat,   goos: linux,   goarch: mips,   gomips: softfloat }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - name: Build sing-box CLI (${{ matrix.name }})
        run: |
          VER="${{ github.ref_name }}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            GOARM=${{ matrix.goarm }} GOMIPS=${{ matrix.gomips }} \
            go build -tags "$SB_TAGS" -trimpath \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=$VER' -s -w" \
            -o "sing-box-${{ matrix.name }}${{ matrix.ext }}" ./cmd/sing-box
          ls -la "sing-box-${{ matrix.name }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ matrix.name }}
          path: sing-box-${{ matrix.name }}${{ matrix.ext }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - run: ls -la artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/sing-box-*
